<div class="bg-gray-50 rounded-md shadow-sm p-4 border border-gray-100">
    <div class="mb-3">
        <h2 class="text-lg font-semibold text-gray-800 mb-1">{{ game.name }}</h2>
        <p class="text-xs text-gray-500">{{ round.date | date:'MMM d, y' }}</p>
    </div>
    
    <div class="flex gap-3">
        <div class="flex-1">
            <div class="bg-yellow-50 border border-yellow-200 rounded p-2">
                <div class="text-xs text-yellow-700 mb-1 font-medium">🥇 Winner</div>
                <div class="text-sm font-semibold text-yellow-900">{{ winner.name }}</div>
            </div>
        </div>
        
        <div class="flex-1" *ngIf="runnerUp">
            <div class="bg-gray-100 border border-gray-300 rounded p-2">
                <div class="text-xs text-gray-600 mb-1 font-medium">🥈 Runner-up</div>
                <div class="text-sm font-semibold text-gray-800">{{ runnerUp.name }}</div>
            </div>
        </div>
    </div>
</div>
