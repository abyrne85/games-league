<div class="flex flex-col gap-4 my-4">

    <p-select [(ngModel)]="selectedLeagueId"
        [options]="leagues"
        optionLabel="name"
        optionValue="_id"
        (onChange)="getLeagueRounds(selectedLeagueId)"></p-select>

    <div *ngIf="loading" class="flex flex-col items-center justify-center gap-3 py-16 text-gray-500">
        <p-progress-spinner strokeWidth="4" ariaLabel="Loading" styleClass="w-12 h-12"></p-progress-spinner>
        <span>Loading results…</span>
    </div>

    <app-league-table *ngIf="rounds.length > 0"
        [rounds]="rounds"
        [players]="players"></app-league-table>
</div>

<div *ngFor="let round of rounds">
    <app-round-card [round]="round"
        class="mb-2"
        [games]="games"
        [players]="players"></app-round-card>
</div>
