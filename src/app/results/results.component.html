<div class="flex flex-col gap-4 my-4">

    <p-select [(ngModel)]="selectedLeagueId"
        [options]="leagues"
        optionLabel="name"
        optionValue="_id"
        (onChange)="getLeagueRounds(selectedLeagueId)"></p-select>

    <app-league-table *ngIf="rounds.length > 0"
        [rounds]="rounds"
        [players]="players"></app-league-table>
</div>

<div *ngFor="let round of rounds">
    <app-round-card [round]="round"
        class="mb-2"
        [games]="games"
        [players]="players"></app-round-card>
</div>
