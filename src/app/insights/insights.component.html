<div class="flex flex-col gap-4 my-4">
    <p-select [(ngModel)]="selectedLeagueId"
        [options]="leagueOptions()"
        optionLabel="name"
        optionValue="_id"
        (onChange)="onLeagueChange()"></p-select>

    <p *ngIf="loading()" class="text-gray-500">Loading…</p>
    <p *ngIf="!loading() && !hasData()" class="text-gray-500">No rounds yet for this selection.</p>

    <ng-container *ngIf="!loading() && hasData()">
        <app-league-table [rounds]="rounds()" [players]="players()"></app-league-table>

        <section class="card">
            <h3>Points over time</h3>
            <p-chart type="line" [data]="pointsChart()" [options]="lineOptions" height="320px"></p-chart>
        </section>

        <section class="card">
            <h3>Win rate</h3>
            <p-chart type="bar" [data]="winRateChart()" [options]="winRateOptions" height="260px"></p-chart>
        </section>

        <section class="card">
            <h3>Podium breakdown</h3>
            <p-chart type="bar" [data]="podiumChart()" [options]="stackedOptions" height="260px"></p-chart>
        </section>

        <section class="card">
            <h3>Most played games</h3>
            <p-chart type="doughnut" [data]="gamesChart()" [options]="gamesOptions" height="300px"></p-chart>
        </section>
    </ng-container>
</div>
