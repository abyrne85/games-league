<div class="flex flex-col gap-4 my-4">
    <p-select [(ngModel)]="selectedLeagueId"
        [options]="leagueOptions()"
        optionLabel="name"
        optionValue="_id"
        (onChange)="onLeagueChange()"></p-select>

    <div *ngIf="loading()" class="flex flex-col items-center justify-center gap-3 py-16 text-gray-500">
        <p-progress-spinner strokeWidth="4" ariaLabel="Loading" styleClass="w-12 h-12"></p-progress-spinner>
        <span>Loading insights…</span>
    </div>
    <p *ngIf="!loading() && !hasData()" class="text-gray-500">No rounds yet for this selection.</p>

    <ng-container *ngIf="!loading() && hasData()">
        <app-league-table [rounds]="rounds()" [players]="players()"></app-league-table>

        <section class="card">
            <h3>Points over time</h3>
            <p-chart type="line" [data]="pointsChart()" [options]="lineOptions" height="320px"></p-chart>
        </section>

        <section class="card">
            <h3>Podium breakdown</h3>
            <p-chart type="bar" [data]="podiumChart()" [options]="stackedOptions" height="260px"></p-chart>
        </section>

        <section class="card">
            <h3>Most played games</h3>
            <p-chart type="doughnut" [data]="gamesChart()" [options]="gamesOptions" height="300px"></p-chart>
        </section>

        <section class="card">
            <h3>Best player per game</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="text-left text-xs uppercase tracking-wider text-gray-500 border-b border-gray-200">
                            <th class="py-2 pr-4 font-medium">Game</th>
                            <th class="py-2 px-2 font-medium text-center">Rounds</th>
                            <th class="py-2 pl-4 font-medium">Most wins</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let g of gameLeaders()" class="border-b border-gray-100 last:border-0">
                            <td class="py-3 pr-4 font-medium">{{ g.game.name }}</td>
                            <td class="py-3 px-2 text-center">{{ g.rounds }}</td>
                            <td class="py-3 pl-4">
                                <span *ngFor="let p of g.leaders; let last = last">{{ p.name }}{{ last ? '' : ', ' }}</span>
                                <span class="text-gray-500"> ({{ g.wins }} {{ g.wins === 1 ? 'win' : 'wins' }})</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </ng-container>
</div>
