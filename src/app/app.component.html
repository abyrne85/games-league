<div *ngIf="updateAvailable()"
    class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 rounded-lg bg-gray-900 text-white px-4 py-3 shadow-lg">
    <span class="text-sm">A new version is available.</span>
    <button type="button"
        class="rounded bg-white text-gray-900 text-sm font-semibold px-3 py-1"
        (click)="reload()">Reload</button>
</div>
<router-outlet></router-outlet>
