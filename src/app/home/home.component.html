<div class="container mx-auto">
    <div *ngIf="loading()" class="flex flex-col items-center justify-center gap-3 py-16 text-gray-500">
        <p-progress-spinner strokeWidth="4" ariaLabel="Loading" styleClass="w-12 h-12"></p-progress-spinner>
        <span>Loading games and players…</span>
    </div>
    <p-tabs [value]="tabIndex"
        (valueChange)="selectTab($event)"
        [lazy]="true"
        *ngIf="!loading()">
        <p-tablist>
            <p-tab [value]="1">Standings</p-tab>
            <p-tab [value]="0">New Round</p-tab>
            <p-tab [value]="2">Insights</p-tab>
        </p-tablist>
        <p-tabpanels>
            <p-tabpanel [value]="0">
                <app-new-round (roundAdded)="selectTab(1)"></app-new-round>
            </p-tabpanel>
            <p-tabpanel [value]="1">
                <app-results *ngIf="tabIndex === 1"></app-results>
            </p-tabpanel>
            <p-tabpanel [value]="2">
                <app-insights *ngIf="tabIndex === 2"></app-insights>
            </p-tabpanel>
        </p-tabpanels>
    </p-tabs>
</div>
