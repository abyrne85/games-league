<div class="container mx-auto">
    <div class="max-w-lg mx-auto mt-8 flex gap-4"  >
        <input type="password"
            name="password"
            placeholder="Password"
            pInputText
            [(ngModel)]="password"
            [fluid]="true" />
        <p-button label="Login"
            type="submit"
            (click)="onSubmit()" />
    </div>
</div>
